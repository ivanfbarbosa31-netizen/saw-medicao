<script>
"use strict";
/* ===================== Armazenamento (IndexedDB) ===================== */
const DB = (() => {
  let db;
  const NOME = 'esquadro';
  const abrir = (nome, criar) => new Promise((ok, err) => {
    const r = indexedDB.open(nome);
    r.onupgradeneeded = () => { if (criar) { r.result.createObjectStore('kv'); r.result.createObjectStore('fotos'); } };
    r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error);
  });
  const tudo = (d, st) => new Promise(ok => { const out = [], c = d.transaction(st).objectStore(st).openCursor(); c.onsuccess = () => { const k = c.result; if (k) { out.push([k.key, k.value]); k.continue(); } else ok(out); }; });
  // Copia, uma única vez, os dados de uma versão anterior do app guardados com outro nome de banco.
  const migrarAnterior = async () => {
    if (!indexedDB.databases) return;
    for (const info of await indexedDB.databases()) {
      if (!info.name || info.name === NOME) continue;
      const velho = await abrir(info.name, false).catch(() => null); if (!velho) continue;
      if (velho.objectStoreNames.contains('kv') && velho.objectStoreNames.contains('fotos')) {
        for (const st of ['kv', 'fotos']) for (const [k, v] of await tudo(velho, st)) await tx(st, 'readwrite', s => s.put(v, k));
      }
      velho.close();
      if (await tx('kv', 'readonly', s => s.get('estado'))) return;
    }
  };
  const open = async () => {
    db = await abrir(NOME, true);
    if (!(await tx('kv', 'readonly', s => s.get('estado')))) await migrarAnterior().catch(() => { });
  };
  const tx = (store, mode, fn) => new Promise((ok, err) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store); const req = fn(s);
    t.oncomplete = () => ok(req && req.result); t.onerror = () => err(t.error);
  });
  return {
    open,
    get: (st, k) => tx(st, 'readonly', s => s.get(k)),
    put: (st, k, v) => tx(st, 'readwrite', s => s.put(v, k)),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
    // [chave, valor] das chaves que começam com o prefixo, em ordem crescente
    lista: (st, pre) => new Promise((ok, err) => { const out = [], c = db.transaction(st).objectStore(st).openCursor(IDBKeyRange.bound(pre, pre + '\uffff')); c.onsuccess = () => { const k = c.result; if (k) { out.push([k.key, k.value]); k.continue(); } else ok(out); }; c.onerror = () => err(c.error); }),
  };
})();

let S = { projetos: [], leiturasSoltas: [], lixeira: [], excluidos: [], bkp: { ultimo: null, n: 0, desde: null }, schema: 2 };
/* ===================== Modelo de dados (pronto para sincronizar) ===================== */
// Cada projeto, área, item, valor e leitura tem: id (UUID estável), criado_em, alterado_em e excluido_em (ms).
// Estrutura: projeto > área > item (esboço, foto, nota, scan) > valor (parede, abertura, seta, altura) + leitura do laser.
// Origem da medida: laser | manual (digitada) | importada | nula (estimada). Projeto tem o campo opcional pv.
const ESQUEMA = 2, VERSAO_APP = '0.8.3';
const RE_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function hash128(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) { k = str.charCodeAt(i); h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233); h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179); }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233); h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}
// UUID derivado do texto: o mesmo id antigo gera sempre o mesmo UUID, em qualquer aparelho (migração repetível).
function uuidDet(txt) {
  const x = hash128('nycxo-medida:' + txt).map(n => n.toString(16).padStart(8, '0')).join('');
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-5${x.slice(13, 16)}-${((parseInt(x[16], 16) & 3) | 8).toString(16)}${x.slice(17, 20)}-${x.slice(20, 32)}`;
}
const uid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const x = [...b].map(n => n.toString(16).padStart(2, '0')).join('');

  }

/* ===================== Modelo da área: base com esboços, fotos, notas e scans ===================== */
// Esboço: pts desenhados (mm) definem as DIREÇÕES; a medida de cada parede (walls[i].mm) define o COMPRIMENTO.
function novoEsboco(nome, pos) { return { id: uid(), nome, pts: [], walls: [], fechado: false, aberturas: [], altura: null, alturaO: null, pos: pos || { x: 0, y: 0, w: 1200 } }; }

      e.pts = fech ? pts.slice(0, -1) : pts; e.fechado = fech; e.walls = a.paredes.map(w => ({ mm: w.mm ?? null, o: w.o ?? null }));

    }

  }
  if (typeof a.nota === 'string') { if (a.nota.trim()) a.notas.push({ id: uid(), texto: a.nota, pos: null }); delete a.nota; }
  // origens de medida desconhecidas (versões anteriores) viram "importada"
  const fixa = x => { if (x && x.o && !ORIG[x.o]) x.o = 'importada'; };
  a.leituras.forEach(l => { if (l.grupo && !/^Grupo/.test(l.grupo)) l.grupo = nomeGrupo(l.grupo); });
  a.leituras.forEach(fixa); a.fotos.forEach(f => (f.setas || []).forEach(fixa));
  a.esbocos.forEach(e => { e.walls.forEach(fixa); if (e.alturaO && !ORIG[e.alturaO]) e.alturaO = 'importada'; });

async function reduzir(file, max = 2000) {
  const bmp = await createImageBitmap(file); const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
}

  add(0, 'SECTION', 2, 'TABLES');

async function lerBackup(f) {

  return { projetos: proj.projetos, leiturasSoltas: proj.leiturasSoltas, fotos, esquema: j.esquema || 1, app: j.app || 'v0.6 ou anterior' };
}
// Mesclagem por id: nunca sobrescreve às cegas. Projeto novo entra; projeto existente mantém a versão mais nova

const naLixeira = (tipo, id) => (S.lixeira || []).some(x => x.tipo === tipo && x.dado.id === id);
function planejarMesclagem(b) {
  const pl = { novos: [], mudar: [], iguais: [], lixeira: [], areasNovas: 0, areasAtualizadas: 0, areasMantidas: 0, areasLixeira: 0, leituras: 0 };
  for (const pin of b.projetos) {
    if (naLixeira('projeto', pin.id)) { pl.lixeira.push(pin); continue; }
    const loc = S.projetos.find(p => p.id === pin.id);
    if (!loc) { pl.novos.push(pin); pl.areasNovas += pin.areas.length; continue; }
    const ac = { pin, loc, arquivoMaisNovo: pin.alterado_em > loc.alterado_em, novas: [], trocar: [] };
    for (const ain of pin.areas) {
      if (naLixeira('area', ain.id)) { pl.areasLixeira++; continue; }
      const aloc = loc.areas.find(a => a.id === ain.id);
      if (!aloc) { ac.novas.push(ain); pl.areasNovas++; }
      else if (ain.alterado_em > aloc.alterado_em) { ac.trocar.push(ain); pl.areasAtualizadas++; }
      else pl.areasMantidas++;
    }
    (ac.arquivoMaisNovo || ac.novas.length || ac.trocar.length ? pl.mudar : pl.iguais).push(ac);
  }
  const ids = new Set(S.leiturasSoltas.map(l => l.id)); pl.leituras = (b.leiturasSoltas || []).filter(l => !ids.has(l.id)).length;
  pl.nada = !pl.novos.length && !pl.mudar.length && !pl.leituras;

}

    for (const a of ac.novas) { await gravarFotosDaArea(a, b.fotos); loc.areas.push(a); }
    loc.alterado_em = Math.max(loc.alterado_em, pin.alterado_em);
  }
  const ids = new Set(S.leiturasSoltas.map(l => l.id));
  for (const l of b.leiturasSoltas || []) if (!ids.has(l.id)) S.leiturasSoltas.push(l);

/* ===================== Importar planilha do laser (.xls BIFF8) ===================== */
// A planilha vem em .xls (xlslib) com o fluxo Workbook contíguo; basta varrer os registros BIFF.
function lerXls(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let p = -1;
  for (let i = 0; i < u8.length - 6; i++) if (u8[i] === 0x09 && u8[i + 1] === 0x08 && u8[i + 2] === 0x10 && u8[i + 3] === 0 && u8[i + 4] === 0 && u8[i + 5] === 6) { p = i; break; }
  if (p < 0) throw new Error('Planilha não reconhecida');
  const sst = [], cel = {};
  const str = (o, n, end) => {
    const fl = u8[o++]; let rt = 0, sz = 0;
    if (fl & 8) { rt = dv.getUint16(o, true); o += 2; } if (fl & 4) { sz = dv.getUint32(o, true); o += 4; }
    let s = ''; if (fl & 1) { for (let k = 0; k < n && o + 1 < end; k++, o += 2) s += String.fromCharCode(dv.getUint16(o, true)); } else { for (let k = 0; k < n && o < end; k++) s += String.fromCharCode(u8[o++]); }
    return [s, o + 4 * rt + sz];
  };
  const rk = v => { let x; if (v & 2) { x = v >> 2; } else { const b = new DataView(new ArrayBuffer(8)); b.setUint32(4, v & 0xfffffffc, true); x = b.getFloat64(0, true); } return v & 1 ? x / 100 : x; };
  while (p + 4 <= u8.length) {
    const t = dv.getUint16(p, true), l = dv.getUint16(p + 2, true), b = p + 4; p = b + l;
    if (t === 0xFC) { const u = dv.getUint32(b + 4, true); let o = b + 8; for (let k = 0; k < u && o < b + l; k++) { const n = dv.getUint16(o, true); let s; [s, o] = str(o + 2, n, b + l); sst.push(s); } }
    else if (t === 0xFD) { (cel[dv.getUint16(b, true)] ??= {})[dv.getUint16(b + 2, true)] = sst[dv.getUint32(b + 6, true)]; }
    else if (t === 0x203) { (cel[dv.getUint16(b, true)] ??= {})[dv.getUint16(b + 2, true)] = dv.getFloat64(b + 6, true); }
    else if (t === 0x27E) { (cel[dv.getUint16(b, true)] ??= {})[dv.getUint16(b + 2, true)] = rk(dv.getUint32(b + 6, true)); }
    else if (t === 0x204) { (cel[dv.getUint16(b, true)] ??= {})[dv.getUint16(b + 2, true)] = str(b + 8, dv.getUint16(b + 6, true), b + l)[0]; }
    else if (t === 0x0A && Object.keys(cel).length) break;
  }
  const linhas = Object.keys(cel).map(Number).sort((x, y) => x - y).map(r => cel[r]);
  const cab = Object.values(linhas[0] || {}).map(String);
  return linhas.slice(1).map(c => { const o = {}; Object.keys(c).forEach(k => o[cab[k]] = c[k]); return o; });
}
// Datas no sistema Excel de 1904 (conferido: 44850 = 17/10/2026).
const xlsData = (d, h) => { const dia = Math.floor(d); const base = new Date(1904, 0, 1); base.setDate(base.getDate() + dia); return base.getTime() + Math.round((h ?? (d - dia)) * 864e5); };

const nomeGrupo = g => { const m = String(g || '').match(/(\d+)\s*$/); return m ? 'Grupo ' + m[1] : (g ? 'Grupo' : 'Planilha'); };
async function importarXls(a, u8) {
  let rows; try { rows = lerXls(u8); } catch (e) { return aviso('Não consegui ler', esc(e.message)); }

  if (!rows.length) return aviso('Planilha vazia', 'Nenhuma medida encontrada.');
  const grupos = {}; rows.forEach(r => { const g = nomeGrupo(r['Grupo de medição']); (grupos[g] ??= []).push(r); });
  const ordem = Object.keys(grupos).sort((x, y) => xlsData(grupos[y][0]['Data'], grupos[y][0]['Hora']) - xlsData(grupos[x][0]['Data'], grupos[x][0]['Hora']));
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<b>Importar para “${esc(a.nome)}”</b><p class="muted">${rows.length} medidas em ${ordem.length} grupo(s). Marque os grupos desta visita.</p>
   <div style="max-height:50vh;overflow:auto">${ordem.map((g, i) => `<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)"><input type="checkbox" value="${i}" style="width:auto" ${ordem.length === 1 ? 'checked' : ''}> ${esc(g)} — ${grupos[g].length} medida(s), ${fdt(xlsData(grupos[g][0]['Data'], grupos[g][0]['Hora']))}</label>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn2" id="xc">Cancelar</button><button id="xo">Importar</button></div>`;
  dlg.showModal();
  dlg.querySelector('#xc').onclick = () => dlg.close();
  dlg.querySelector('#xo').onclick = () => {
    const chave = new Set(a.leituras.map(l => l.grupo + '|' + l.ts + '|' + l.mm)); let n = 0;
    dlg.querySelectorAll('input:checked').forEach(c => grupos[ordem[c.value]].forEach(r => {
      const l = { id: uid(), mm: Math.round(r['Valor'] * 100) / 100, o: 'importada', ts: xlsData(r['Data'], r['Hora']), nome: r['Nomear'] && r['Nomear'] !== r['Tipo'] ? r['Nomear'] : '', grupo: ordem[c.value] };
      const k = l.grupo + '|' + l.ts + '|' + l.mm; if (!chave.has(k)) { chave.add(k); a.leituras.push(l); n++; }
    }));
    tocar(); dlg.close(); toast(`${n} medida(s) importada(s).`); render();
  };
}

function esbBounds(e, comFundo = true) {

    (e.fundo.segs || []).forEach(s => { xs.push(s[0], s[2]); ys.push(s[1], s[3]); });
  }
  if (xs.length < 2) return null;
  const x = Math.min(...xs), y = Math.min(...ys);

}

function lerDxf(txt) {

    if (c === 0 && v === 'SECTION') { sec = P[i + 1]?.[0] === 2 ? P[i + 1][1] : null; continue; }
    if (c === 0 && v === 'ENDSEC') { sec = null; cur = null; continue; }

  }

  const titulo = (s, tam = 14) => { precisa(tam * 0.5 + 10); doc.setFont('helvetica', 'bold'); doc.setFontSize(tam); cor(29, 27, 24); doc.text(T(s), M, y + tam * 0.35); y += tam * 0.45 + 4; };
  const kv = (k, v) => {
    precisa(7); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); cor(70, 65, 58); doc.text(T(k), M, y + 4);
    doc.setFont('helvetica', 'bold'); cor(29, 27, 24); doc.text(T(v), PW - M, y + 4, { align: 'right' });
    doc.setDrawColor(238, 232, 222); doc.line(M, y + 6, PW - M, y + 6); y += 7;
  };
  const texto = s => { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); cor(70, 65, 58); for (const l of doc.splitTextToSize(T(s), CW)) { precisa(5); doc.text(l, M, y + 4); y += 5; } y += 2; };
  const areas = soArea ? [soArea] : p.areas;
  // capa
  cab();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(22); cor(29, 27, 24); doc.text(T(p.nome), M, y + 8); y += 13;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); cor(133, 124, 111); doc.text(T(soArea ? `Relatório de medição — ${soArea.nome}` : 'Relatório de medição'), M, y + 2); y += 10;
  if (c.pdf.cliente) { const cl = CAMPOS.filter(([k]) => p.cliente?.[k]); if (cl.length) { titulo('Cliente', 12); cl.forEach(([k, l]) => kv(l, p.cliente[k])); y += 4; } }
  titulo('Ambientes', 12);
  areas.forEach(a => { const ar = a.esbocos.reduce((s, e) => s + (esbGeo(e).area || 0), 0); kv(a.nome, `${a.esbocos.length} planta(s) · ${a.fotos.length} foto(s)${ar ? ' · ' + m2(ar) : ''}`); });
  if (!soArea && c.pdf.plantaCompleta && esbocosDoProjeto(p).length > 1) {
    const im = await plantaPNG(p).catch(() => null);
    if (im) { cab(); titulo('Planta completa', 16); let w = CW, h = CW * im.h / im.w; if (h > 230) { h = 230; w = h * im.w / im.h; } doc.addImage(im.url, 'PNG', M + (CW - w) / 2, y, w, h); y += h + 5; }
  }
  for (const a of areas) {
    cab(); titulo(a.nome, 16);
    for (const e of a.esbocos) {
      if (a.esbocos.length > 1 || e.nome !== a.nome) titulo(e.nome, 12);
      if (c.pdf.planta && e.pts.length > 1) {
        a.fotos.forEach((f, i) => { f._n = i + 1; }); const im = await esbocoPNG(e, a.fotos).catch(() => null); a.fotos.forEach(f => delete f._n);
        if (im) { let w = CW, h = CW * im.h / im.w; if (h > 150) { h = 150; w = h * im.w / im.h; } precisa(h + 4); doc.addImage(im.url, 'PNG', M + (CW - w) / 2, y, w, h); y += h + 5; }
      }
      const I = esbInfo(e), g = I.g;
      if (c.pdf.info && g.n) {
        const est = g.todasMedidas ? '' : ' (estimado)';
        kv('Área do piso', m2(g.area) + (g.area != null ? est : '')); kv('Perímetro', fL(g.per) + est); kv('Pé-direito', fL(e.altura));
        kv('Área bruta de parede', m2(I.bruta)); kv('Área líquida de parede', m2(I.liquida)); kv('Volume', m3(I.volume));
        kv('Portas / janelas', `${e.aberturas.filter(o => o.tipo === 'porta').length} / ${e.aberturas.filter(o => o.tipo !== 'porta').length}`); y += 3;
      }
      if (c.pdf.paredes && g.n) {
        titulo('Paredes', 11);
        for (let i = 0; i < g.n; i++) { const t3 = tresInfo(e.walls[i]); kv(`P${i + 1}`, `${fL(g.len[i])} · ${g.est[i] ? 'estimada' : ORIG_TXT[e.walls[i]?.o] || 'digitada'}${t3 ? ` · 3 pts ${e.walls[i].tres.map(fN).join(' / ')} (dif. ${fL(t3.dif)})` : ''}`); }
        if (e.diag) kv('Esquadro (D1 / D2)', `${fL(e.diag.d1)} / ${fL(e.diag.d2)} · ${esquadroTxt(e)}`);
        e.aberturas.forEach((o, j) => kv(`${o.tipo === 'porta' ? 'Porta' : 'Janela'} ${j + 1} · parede P${+o.parede + 1}`, `${fL(o.larg)} x ${fL(o.alt)}${o.tipo !== 'porta' ? ' · peitoril ' + fL(o.peit) : ''} · a ${fL(o.dist)} do canto`));
        y += 3;
      }
      if (c.pdf.elevacao) for (const i of paredesComVista(e)) {
        titulo(`Parede P${i + 1} — vista de dentro`, 11);
        const im = await paredePNG(e, i).catch(() => null);
        if (im) { let w = CW, h = CW * im.h / im.w; if (h > 110) { h = 110; w = h * im.w / im.h; } precisa(h + 4); doc.addImage(im.url, 'PNG', M + (CW - w) / 2, y, w, h); y += h + 4; }
        e.pontos.filter(pt => +pt.parede === i).sort((p1, p2) => p1.x - p2.x).forEach(pt => kv(`${(TIPOS_PONTO[pt.tipo] || TIPOS_PONTO.outro)[0]}${pt.obs ? ' · ' + pt.obs : ''}`, `${fL(pt.x)} da esquerda · altura ${fL(pt.h)}`));
        y += 3;
      }
      if (c.pdf.notas) {
        if (e.nota) { titulo('Nota da planta', 11); texto(e.nota); }
        if ((e.textos || []).length) { titulo('Textos na planta', 11); e.textos.forEach(t => texto('• ' + t.t.replace(/\n/g, ' '))); }
      }
    }
    if (c.pdf.checklist && (a.check && Object.keys(a.check).length || a.esbocos.length)) {
      const pr = checkProgresso(a); titulo(`Checklist da medição · ${pr.feito}/${pr.total}`, 12);
      CHECK_AUTO.forEach(([, l, f]) => kv(l, f(a) ? 'feito' : 'pendente'));
      CHECK_ITENS.forEach(([k, l]) => { const it = a.check?.[k] || {}; kv(l, (it.s === 'ok' ? 'feito' : it.s === 'na' ? 'não se aplica' : 'pendente') + (it.obs ? ' · ' + it.obs : '')); });
      y += 3;
    }
    if (c.pdf.notas && a.notas.some(n => n.texto?.trim())) { titulo('Notas', 12); a.notas.filter(n => n.texto?.trim()).forEach(n => texto(n.texto)); }
    if (c.pdf.fotos && a.fotos.length) {
      titulo('Fotos', 12);
      const n = c.fotosPag, cols = n === 4 ? 2 : 1, gap = 6, cw = (CW - (cols - 1) * gap) / cols, maxH = n === 1 ? 185 : n === 2 ? 100 : 88;
      let col = 0, linhaH = 0;
      for (const [i, f] of a.fotos.entries()) {
        const cv = await canvasFoto(f, Q[0]).catch(() => null); if (!cv) continue;
        let w = cw, h = cw * cv.height / cv.width; if (h > maxH) { h = maxH; w = h * cv.width / cv.height; }
        const esb = a.esbocos.find(x => x.id === f.liga?.e);
        doc.setFontSize(9);
        const leg = [T(`Foto ${i + 1}${esb ? ` · ${esb.nome}, parede P${f.liga.w + 1}` : ''}`),
          ...doc.splitTextToSize(T(f.setas.filter(s => s.mm != null).map((s, j) => `${TIPOS_SETA[s.tipo]?.[0] || 'Seta ' + (j + 1)}: ${fL(s.mm)}`).join('   ')), cw)];
        const bloco = h + 4 + leg.length * 4.3;
        if (col === 0) precisa(bloco);
        const x0 = M + col * (cw + gap);
        doc.addImage(cv.toDataURL('image/jpeg', Q[1]), 'JPEG', x0 + (cw - w) / 2, y, w, h);
        leg.forEach((l, j) => { doc.setFont('helvetica', j ? 'normal' : 'bold'); cor(j ? 70 : 29, j ? 65 : 27, j ? 58 : 24); doc.text(l, x0, y + h + 4.5 + j * 4.3); });
        linhaH = Math.max(linhaH, bloco + 5);
        if (++col >= cols) { col = 0; y += linhaH; linhaH = 0; }
      }
      if (col) y += linhaH;
    }
    if (c.pdf.leituras && a.leituras.length) { titulo('Leituras do laser', 12); [...a.leituras].sort((x, z) => x.ts - z.ts).forEach(l => kv(`${fdt(l.ts)}${l.nome ? ' · ' + l.nome : ''}`, fL(l.mm))); }
  }
  const tot = doc.getNumberOfPages();
  for (let i = 1; i <= tot; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); cor(133, 124, 111); doc.text(T(`NYCXO Medida · ${p.nome}`), M, PH - 8); doc.text(`${i} / ${tot}`, PW - M, PH - 8, { align: 'right' }); }
  const blob = doc.output('blob');
  window.__ultimoPDF = { blob, paginas: tot };
  baixar(`${p.nome}${soArea ? ' - ' + soArea.nome : ''}.pdf`, blob, 'application/pdf');
}

const ESC = { pts: [] }; // pontos do dimensionamento

/* ===================== Lixeira (30 dias) ===================== */
const LIXEIRA_DIAS = 30, DIA = 86400e3;
const blobsDoItem = x => x.tipo === 'projeto' ? x.dado.areas.flatMap(blobsDaArea) : blobsDaArea(x.dado);
async function apagarDefinitivo(x) {
  for (const f of blobsDoItem(x)) await DB.del('fotos', f.id);
  S.lixeira = S.lixeira.filter(y => y !== x); delete URLS[x.id];
}
// Itens com mais de 30 dias saem de vez (e as fotos junto).
async function limparLixeira() {
  const vencidos = (S.lixeira || []).filter(x => Date.now() - x.em > LIXEIRA_DIAS * DIA);
  for (const x of vencidos) await apagarDefinitivo(x);
  if (vencidos.length) await salvar();
  return vencidos.length;
}
async function restaurarDaLixeira(x) {
  if (x.tipo === 'projeto') {
    if (S.projetos.some(p => p.id === x.dado.id)) return aviso('Já existe', 'Este projeto já está na lista.');
    x.dado.excluido_em = null; S.projetos.push(x.dado);
  } else {
    const p = S.projetos.find(q => q.id === x.projetoId);
    if (!p) return aviso('Restaure o projeto primeiro', 'A área “' + esc(x.nome) + '” pertencia ao projeto “' + esc(x.projetoNome) + '”, que não está na lista. Restaure o projeto e depois a área.');
    x.dado.excluido_em = null; p.areas.push(x.dado); p.alt = Date.now();
  }
  S.lixeira = S.lixeira.filter(y => y !== x); await salvar(); toast('Restaurado.'); render();
}
function cardLixeira() {
  const L = [...(S.lixeira || [])].sort((a, b) => b.em - a.em);
  return `<div class="card" id="dLix"><b>Lixeira</b><p class="muted">Projetos e áreas excluídos ficam aqui por ${LIXEIRA_DIAS} dias e podem ser restaurados. Depois disso são apagados de vez, com as fotos.</p>
   ${L.length ? L.map(x => `<div class="kv"><span>${esc(x.nome)}<br><small>${x.tipo === 'projeto' ? 'Projeto' : 'Área de ' + esc(x.projetoNome)} · apaga em ${Math.max(0, Math.ceil((x.em + LIXEIRA_DIAS * DIA - Date.now()) / DIA))} dia(s)</small></span><span class="row" style="flex:0 0 auto;gap:6px"><button class="btn2 small" data-lrest="${x.id}">Restaurar</button><button class="btnbad small" data-ldel="${x.id}">Apagar</button></span></div>`).join('') : '<div class="vazio" style="padding:14px">Lixeira vazia.</div>'}</div>`;
}
function ligarLixeira() {
  app.querySelectorAll('[data-lrest]').forEach(b => b.onclick = () => restaurarDaLixeira(S.lixeira.find(x => x.id === b.dataset.lrest)));
  app.querySelectorAll('[data-ldel]').forEach(b => b.onclick = async () => {
    const x = S.lixeira.find(y => y.id === b.dataset.ldel);
    if (!await confirmar('Apagar “' + x.nome + '” de vez, com as fotos? Não dá para desfazer.')) return;
    await apagarDefinitivo(x); await salvar(); render();
  });
}

/* ===================== Migração para o esquema atual ===================== */
// Migra o estado inteiro (ids curtos -> UUID, carimbos, pv). Devolve o mapa id antigo -> UUID.
function migrarEstado(est) {
  est.projetos ??= []; est.leiturasSoltas ??= []; est.lixeira ??= []; est.excluidos ??= [];
  const mapa = uuidizar(est);
  est.projetos.forEach(p => { p.areas ??= []; p.cliente ??= {}; p.areas.forEach(migrarArea); completarProjeto(p, true); });
  for (const x of est.lixeira) { const ps = x.tipo === 'projeto' ? x.dado : { id: x.projetoId, criado: x.dado.data, alt: x.em, areas: [x.dado] }; ps.areas.forEach(migrarArea); completarProjeto(ps, true); }
  est.leiturasSoltas.forEach((l, i) => completar('leitura', l, null, null, true, i, Date.now()));
  est.schema = ESQUEMA;
  return mapa;
}
// Executada na abertura: cópia de segurança antes de migrar, depois copia as fotos para as chaves novas e só então apaga as antigas.
async function migrarDados() {
  S.lixeira ??= []; S.excluidos ??= []; S.leiturasSoltas ??= []; S.bkp ??= { ultimo: null, n: 0, desde: null };
  if ((S.schema || 1) >= ESQUEMA) { S.projetos.forEach(p => p.areas.forEach(migrarArea)); return; }
  await DB.put('kv', 'snap-mig:v1', { ts: Date.now(), motivo: 'Antes da atualização do modelo de dados', estado: S });
  const mapa = migrarEstado(S);
  for (const [velho, novo] of mapa) { const b = await DB.get('fotos', velho); if (b) await DB.put('fotos', novo, b); }
  await DB.put('kv', 'estado', S);
  for (const [velho] of mapa) await DB.del('fotos', velho);
}

/* ===================== Início ===================== */
(async () => {
  await DB.open();
  const e = await DB.get('kv', 'estado'); if (e) S = { ...S, ...e, schema: e.schema || 1, bkp: { ...S.bkp, ...(e.bkp || {}) } };
  try { await migrarDados(); } catch (err) { console.error('migracao', err); S.projetos.forEach(p => p.areas.forEach(migrarArea)); }
  normalizarCfg();
  reiniciarFP();
  limparLixeira().catch(() => { });
  iniciarPersist().then(() => { if (rota.v === 'cfg') render(); });
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(r => r.active && r.active.postMessage('guardar-libs')).catch(() => { });
  }
})();
</script>
